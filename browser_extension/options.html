<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  /* paleta mmaly.cz 2.0 „Skleník" (stejná jako webapp.py) */
  :root { --green: #22c55e; --aqua: #3ee0c3; --raspberry: #e8336f; --ink: #070e0d; --ink-3: #12211e;
          --text: #e4f1ec; --text-dim: #8ba59d; --border: color-mix(in srgb, #9ef0cc 12%, transparent); color-scheme: dark; }
  body { font: 14px Inter, "Segoe UI", system-ui, sans-serif; margin: 0; padding: 16px; min-width: 340px;
         background: var(--ink); color: var(--text); }
  label { display: block; margin-bottom: 6px; font: 600 11px "JetBrains Mono", ui-monospace, monospace;
          letter-spacing: .12em; text-transform: uppercase; color: #9ef0cc; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; color: var(--text);
          background: var(--ink-3); border: 1px solid var(--border); border-radius: 10px; }
  input:focus { outline: none; border-color: color-mix(in srgb, var(--aqua) 60%, transparent);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--aqua) 16%, transparent); }
  button { font-family: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border);
           background: var(--ink-3); color: var(--text); }
  #save { background: var(--green); color: #04110a; border-color: transparent; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
  #status { font-size: 12px; }
</style>
</head>
<body>
  <label for="server">Adresa grabberu</label>
  <input id="server" type="url" placeholder="http://127.0.0.1:8080">
  <div class="hint">Výchozí je grabber na tomhle počítači. Port změň, pokud spouštíš s <code>--port</code>.</div>
  <div class="row">
    <button id="save">Uložit</button>
    <button id="test">Vyzkoušet spojení</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
