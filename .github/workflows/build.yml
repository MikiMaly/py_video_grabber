name: Build EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastapi "uvicorn[standard]" yt-dlp pyyaml pyinstaller pyinstaller-hooks-contrib

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter bin -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe" ffmpeg\
          Copy-Item "$($bin.FullName)\ffprobe.exe" ffmpeg\

      - name: Build EXE
        run: pyinstaller UltimateVideoDownloader.spec

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\UltimateVideoDownloader\* -DestinationPath "UltimateVideoDownloader-${{ github.ref_name }}-win64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "UltimateVideoDownloader-${{ github.ref_name }}-win64.zip"
          generate_release_notes: true
